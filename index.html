
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1b">
<title>HJH Gaming</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d1b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 30px 12px;
  background: linear-gradient(120deg, #17134b, #06445a);
}

header h1 {
  margin: 0;
  color: #45dcff;
  font-size: clamp(30px, 8vw, 48px);
}

header p {
  margin-bottom: 0;
}

main {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 16px;
}

#search {
  width: 100%;
  padding: 14px;
  margin-bottom: 18px;
  border-radius: 10px;
  border: 1px solid #40516f;
  background: #111b30;
  color: white;
  font-size: 16px;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 14px;
}

.card {
  background: #121c31;
  border: 1px solid #293a59;
  border-radius: 13px;
  padding: 17px;
}

.card h2 {
  color: #65e2ff;
  margin-top: 0;
}

.card p {
  color: #c1cce0;
  min-height: 38px;
  line-height: 1.4;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 12px 16px;
  background: #087fa7;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.play {
  width: 100%;
  background: #078cb8;
}

.panel {
  background: #121c31;
  border: 1px solid #293a59;
  border-radius: 13px;
  padding: 16px;
  margin-top: 18px;
}

.panel[hidden] {
  display: none;
}

#gameTitle {
  color: #65e2ff;
  margin-top: 0;
}

#instructions {
  color: #c1cce0;
  line-height: 1.5;
}

#status {
  color: #ffe08a;
  min-height: 25px;
  font-weight: bold;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

#area {
  width: 100%;
}

.row, .controls {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin: 13px 0;
}

.controls button {
  flex: 1;
  min-width: 60px;
}

input {
  max-width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #40516f;
  background: #080d1b;
  color: white;
  font-size: 17px;
}

.grid {
  display: grid;
  gap: 8px;
  margin: 14px 0;
}

.grid button {
  min-width: 0;
  min-height: 60px;
  font-size: 22px;
}

.playfield {
  display: block;
  width: 100%;
  max-width: 600px;
  height: auto;
  margin: 12px auto;
  border: 2px solid #40516f;
  border-radius: 9px;
  background: #050a14;
  touch-action: none;
}

.small {
  font-size: 13px;
  color: #aabbd3;
}

#back {
  background: #49556b;
}

#restart {
  background: #087fa7;
}

@media(max-width:480px) {
  main {
    padding: 10px;
  }

  .games {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .card {
    padding: 12px;
  }

  .card h2 {
    font-size: 17px;
  }

  .card p {
    font-size: 13px;
  }

  .card button {
    font-size: 13px;
    padding: 11px 5px;
  }
}
</style>
</head>

<body>

<header>
  <h1>HJH GAMING</h1>
  <p>Pick a game. Press PLAY. Have fun!</p>
</header>

<main>

<input
  id="search"
  type="search"
  placeholder="Search games..."
  autocomplete="off"
>

<div id="games" class="games"></div>

<section id="panel" class="panel" hidden>

  <h2 id="gameTitle"></h2>

  <p id="instructions"></p>

  <div id="status" aria-live="polite"></div>

  <div id="area"></div>

  <div class="row">
    <button id="restart">RESTART</button>
    <button id="back">BACK TO GAMES</button>
  </div>

</section>
</main>

<script>
"use strict";

/* =================================
   GAME CATALOG
================================= */

const catalog = [
  ["Pong", "Play classic paddle and ball Pong."],
  ["Brick Breaker", "Break the bricks using your bouncing ball."],
  ["Snake", "Eat food and grow your snake."],
  ["Tic-Tac-Toe", "Get three marks in a row."],
  ["Memory Match", "Find all matching pairs."],
  ["Simon Says", "Remember and repeat the color sequence."],
  ["Reaction Test", "Wait for green and test your reaction."],
  ["Number Guess", "Guess the hidden number."],
  ["Rock Paper Scissors", "Challenge the computer."],
  ["Whack-a-Mole", "Hit the mole before time runs out."],
  ["Math Sprint", "Solve multiplication problems."],
  ["Click Challenge", "Click as many times as possible."]
];

const $ = id => document.getElementById(id);

const games = $("games");
const panel = $("panel");
const area = $("area");
const status = $("status");

let activeGame = "";
let cleanupTasks = [];

/* =================================
   GAME MANAGEMENT
================================= */

function say(message) {
  status.textContent = message;
}

function cleanup() {
  cleanupTasks.forEach(fn => {
    try {
      fn();
    } catch (e) {}
  });

  cleanupTasks = [];
  area.replaceChildren();
  say("");
}

function registerCleanup(fn) {
  cleanupTasks.push(fn);
}

function makeButton(label, callback, parent = area) {
  const button = document.createElement("button");
  button.textContent = label;
  button.type = "button";
  button.addEventListener("click", callback);
  parent.appendChild(button);
  return button;
}

function makeInput(type = "text", placeholder = "") {
  const input = document.createElement("input");
  input.type = type;
  input.placeholder = placeholder;
  area.appendChild(input);
  return input;
}

function makeCanvas() {
  const canvas = document.createElement("canvas");
  canvas.width = 600;
  canvas.height = 360;
  canvas.className = "playfield";
  area.appendChild(canvas);
  return canvas;
}

function timer(fn, delay) {
  const id = setTimeout(fn, delay);
  registerCleanup(() => clearTimeout(id));
  return id;
}

function interval(fn, delay) {
  const id = setInterval(fn, delay);
  registerCleanup(() => clearInterval(id));
  return id;
}

function animation(fn) {
  let id = 0;
  let stopped = false;

  function frame() {
    if (stopped) return;
    fn();
    if (!stopped) id = requestAnimationFrame(frame);
  }

  id = requestAnimationFrame(frame);

  registerCleanup(() => {
    stopped = true;
    cancelAnimationFrame(id);
  });
}

function renderGames() {
  games.replaceChildren();

  const search = $("search").value.toLowerCase().trim();

  catalog
    .filter(([name, description]) =>
      (name + " " + description).toLowerCase().includes(search)
    )
    .forEach(([name, description]) => {

      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = name;

      const desc = document.createElement("p");
      desc.textContent = description;

      const play = makeButton(
        "PLAY",
        () => startGame(name),
        card
      );

      play.className = "play";

      card.prepend(title, desc);
      games.appendChild(card);
    });
}

function startGame(name) {
  cleanup();

  activeGame = name;

  games.hidden = true;
  panel.hidden = false;

  $("gameTitle").textContent = name;

  $("instructions").textContent =
    catalog.find(game => game[0] === name)[1];

  try {
    launch[name]();
  } catch (error) {
    console.error(error);
    say("Game error. Press RESTART to try again.");
  }

  panel.scrollIntoView({behavior: "smooth", block: "start"});
}

function backToGames() {
  cleanup();

  activeGame = "";

  panel.hidden = true;
  games.hidden = false;

  window.scrollTo({top: 0, behavior: "smooth"});
}

$("search").addEventListener("input", renderGames);

$("back").addEventListener("click", backToGames);

$("restart").addEventListener("click", () => {
  if (activeGame) startGame(activeGame);
});

renderGames();

/* =================================
   INDIVIDUAL GAMES
================================= */

const launch = {

/* ---------------------------------
   NUMBER GUESS
--------------------------------- */

"Number Guess"() {

  const answer = Math.floor(Math.random() * 20) + 1;
  let attempts = 0;

  const input = makeInput("number", "Enter a number from 1 to 20");

  input.min = 1;
  input.max = 20;

  makeButton("GUESS", () => {

    const guess = Number(input.value);

    if (!Number.isInteger(guess) || guess < 1 || guess > 20) {
      say("Enter a whole number between 1 and 20.");
      return;
    }

    attempts++;

    if (guess === answer) {
      say("YOU WIN! Guesses: " + attempts);
    } else if (guess < answer) {
      say("Too low! Try a higher number.");
    } else {
      say("Too high! Try a lower number.");
    }

    input.value = "";
    input.focus();

  });

  say("Guess the hidden number!");
},

/* ---------------------------------
   ROCK PAPER SCISSORS
--------------------------------- */

"Rock Paper Scissors"() {

  const choices = ["Rock", "Paper", "Scissors"];

  choices.forEach(choice => {

    makeButton(choice, () => {

      const computer =
        choices[Math.floor(Math.random() * 3)];

      let result;

      if (choice === computer) {
        result = "It's a tie!";
      } else if (
        (choice === "Rock" && computer === "Scissors") ||
        (choice === "Paper" && computer === "Rock") ||
        (choice === "Scissors" && computer === "Paper")
      ) {
        result = "YOU WIN!";
      } else {
        result = "Computer wins!";
      }

      say("You: " + choice + " | Computer: " +
          computer + " | " + result);

    });

  });

  say("Choose Rock, Paper, or Scissors.");
},

/* ---------------------------------
   TIC TAC TOE
--------------------------------- */

"Tic-Tac-Toe"() {

  let cells = Array(9).fill("");
  let turn = "X";
  let finished = false;

  const winningLines = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];

  const grid = document.createElement("div");
  grid.className = "grid";
  grid.style.gridTemplateColumns = "repeat(3, 1fr)";
  area.appendChild(grid);

  function draw() {

    grid.replaceChildren();

    cells.forEach((value, index) => {

      const button = makeButton(
        value || " ",
        () => {

          if (finished || cells[index]) return;

          cells[index] = turn;

          const won = winningLines.some(line =>
            line.every(i => cells[i] === turn)
          );

          if (won) {
            finished = true;
            say(turn + " WINS!");
          } else if (cells.every(Boolean)) {
            finished = true;
            say("DRAW GAME!");
          } else {
            turn = turn === "X" ? "O" : "X";
            say("Player " + turn + "'s turn.");
          }

          draw();

        },
        grid
      );

      button.style.minHeight = "85px";
      button.style.fontSize = "30px";

    });
  }

  draw();
  say("Player X goes first.");
},

/* ---------------------------------
   MEMORY MATCH
--------------------------------- */

"Memory Match"() {

  const symbols = [
    "🍎","🚀","🐱","⚽","🌟","🎵",
    "🍎","🚀","🐱","⚽","🌟","🎵"
  ];

  symbols.sort(() => Math.random() - 0.5);

  let opened = [];
  let matched = new Set();
  let locked = false;

  const grid = document.createElement("div");
  grid.className = "grid";
  grid.style.gridTemplateColumns = "repeat(4, 1fr)";
  area.appendChild(grid);

  function draw() {

    grid.replaceChildren();

    symbols.forEach((symbol, index) => {

      const visible =
        matched.has(index) || opened.includes(index);

      const button = makeButton(
        visible ? symbol : "?",
        () => {

          if (locked || matched.has(index) ||
              opened.includes(index)) return;

          opened.push(index);
          draw();

          if (opened.length === 2) {

            const [first, second] = opened;

            if (symbols[first] === symbols[second]) {

              matched.add(first);
              matched.add(second);
              opened = [];

              say("Matches: " + matched.size / 2 + " / 6");

              if (matched.size === 12) {
                say("YOU FOUND ALL THE PAIRS! YOU WIN!");
              }

              draw();

            } else {

              locked = true;

              timer(() => {
                opened = [];
                locked = false;
                draw();
              }, 850);

            }
          }

        },
        grid
      );

      button.style.minHeight = "65px";
    });
  }

  draw();
  say("Find all six matching pairs.");
},

/* ---------------------------------
   SIMON SAYS
--------------------------------- */

"Simon Says"() {

  const colors = ["red", "blue", "green", "orange"];

  let sequence = [];
  let position = 0;
  let accepting = false;
  let round = 0;

  const controls = document.createElement("div");
  controls.className = "grid";
  controls.style.gridTemplateColumns = "repeat(2, 1fr)";
  area.appendChild(controls);

  const pads = colors.map(color => {

    const button = makeButton(color.toUpperCase(), () => {

      if (!accepting) return;

      if (color !== sequence[position]) {
        accepting = false;
        say("GAME OVER! You reached round " + round +
            ". Press RESTART to try again.");
        return;
      }

      position++;

      if (position === sequence.length) {
        accepting = false;
        say("CORRECT! Get ready for the next round.");

        timer(showSequence, 700);
      }

    }, controls);

    button.style.background = color;
    button.style.minHeight = "90px";

    return button;
  });

  function showSequence() {

    accepting = false;
    position = 0;
    round++;

    sequence.push(
      colors[Math.floor(Math.random() * colors.length)]
    );

    say("Round " + round + " - Watch the colors!");

    sequence.forEach((color, index) => {

      timer(() => {

        pads.forEach(button => {
          button.style.outline = "none";
        });

        const padIndex = colors.indexOf(color);

        pads[padIndex].style.outline = "5px solid white";

        timer(() => {
          pads[padIndex].style.outline = "none";

          if (index === sequence.length - 1) {
            accepting = true;
            say("YOUR TURN! Repeat the sequence.");
          }

        }, 300);

      }, index * 650);

    });
  }

  makeButton("START GAME", showSequence);

  say("Remember the colors in the correct order.");
},

/* ---------------------------------
   REACTION TEST
--------------------------------- */

"Reaction Test"() {

  let phase = "ready";
  let startTime = 0;
  let waitTimer = null;

  const button = makeButton("START", () => {

    if (phase === "ready") {

      phase = "waiting";
      button.textContent = "WAIT...";
      button.style.background = "#a66b13";

      say("Wait until the button turns green!");

      waitTimer = setTimeout(() => {

        phase = "go";
        startTime = performance.now();

        button.textContent = "TAP NOW!";
        button.style.background = "#159447";

        say("TAP NOW!");

      }, 1500 + Math.random() * 3000);

    } else if (phase === "waiting") {

      clearTimeout(waitTimer);

      phase = "ready";
      button.textContent = "TRY AGAIN";
      button.style.background = "";

      say("Too early! Wait until green.");

    } else if (phase === "go") {

      const result = Math.round(performance.now() - startTime);

      phase = "ready";

      button.textContent = "START AGAIN";
      button.style.background = "";

      say("Your reaction time: " + result + " milliseconds!");

    }

  });

  registerCleanup(() => clearTimeout(waitTimer));

  say("Press START and wait for green.");
},

/* ---------------------------------
   WHACK A MOLE
--------------------------------- */

"Whack-a-Mole"() {

  let score = 0;
  let remaining = 15;
  let position = -1;
  let finished = false;

  const grid = document.createElement("div");
  grid.className = "grid";
  grid.style.gridTemplateColumns = "repeat(3, 1fr)";
  area.appendChild(grid);

  const pads = Array.from({length: 9}, (_, index) => {

    const button = makeButton("·", () => {

      if (finished) return;

      if (index === position) {
        score++;
        say("Score: " + score + " | Time: " + remaining);
        moveMole();
      }

    }, grid);

    button.style.minHeight = "75px";
    return button;
  });

  function moveMole() {

    position = Math.floor(Math.random() * 9);

    pads.forEach((button, index) => {
      button.textContent = index === position ? "🐹" : "·";
    });

  }

  moveMole();

  const moleTimer = interval(moveMole, 700);

  const clock = interval(() => {

    remaining--;

    if (remaining <= 0) {

      finished = true;
      clearInterval(moleTimer);
      clearInterval(clock);

      pads.forEach(button => button.disabled = true);

      say("TIME UP! Final score: " + score);

    } else {
      say("Score: " + score + " | Time: " + remaining);
    }

  }, 1000);

  say("Tap the mole as many times as possible!");
},

/* ---------------------------------
   MATH SPRINT
--------------------------------- */

"Math Sprint"() {

  let first = 0;
  let second = 0;
  let score = 0;
  let question = 0;

  const title = document.createElement("h2");
  area.appendChild(title);

  const input = makeInput("number", "Your answer");

  function nextQuestion() {

    first = Math.floor(Math.random() * 11) + 2;
    second = Math.floor(Math.random() * 11) + 2;

    question++;
    title.textContent = first + " × " + second + " = ?";
    input.value = "";
    input.focus();

  }

  makeButton("SUBMIT", () => {

    if (input.value.trim() === "") {
      say("Enter an answer first.");
      return;
    }

    if (Number(input.value) === first * second) {
      score++;
      say("CORRECT! Score: " + score);
    } else {
      say("Incorrect! The answer was " + first * second +
          ". Score: " + score);
    }

    nextQuestion();

  });

  nextQuestion();
},

/* ---------------------------------
   CLICK CHALLENGE
--------------------------------- */

"Click Challenge"() {

  let score = 0;
  let remaining = 10;
  let running = false;

  const button = makeButton("START", () => {

    if (running) {
      score++;
      button.textContent = "TAP! " + score;
      return;
    }

    running = true;
    score = 0;
    remaining = 10;

    button.textContent = "TAP! 0";

    say("Score: 0 | Time: 10");

    const clock = interval(() => {

      remaining--;

      if (remaining <= 0) {

        clearInterval(clock);
        running = false;
        button.disabled = true;

        say("TIME UP! Final score: " + score);

      } else {

        say("Score: " + score + " | Time: " + remaining);

      }

    }, 1000);

  });

  button.style.fontSize = "24px";
  button.style.padding = "25px 35px";

  say("Press START, then tap as fast as possible!");
},

/* ---------------------------------
   SNAKE
--------------------------------- */

"Snake"() {

  const canvas = makeCanvas();
  const ctx = canvas.getContext("2d");

  const size = 20;
  const cols = 30;
  const rows = 18;

  let snake = [
    {x: 10, y: 9},
    {x: 9, y: 9},
    {x: 8, y: 9}
  ];

  let direction = {x: 1, y: 0};
  let nextDirection = {x: 1, y: 0};

  let food = {x: 20, y: 9};
  let dead = false;

  function changeDirection(x, y) {

    if (x === -direction.x && y === -direction.y) return;

    nextDirection = {x, y};
  }

  function keyboard(e) {

    const keys = {
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0]
    };

    if (keys[e.key]) {
      e.preventDefault();
      changeDirection(...keys[e.key]);
    }

  }

  window.addEventListener("keydown", keyboard);

  registerCleanup(() =>
    window.removeEventListener("keydown", keyboard)
  );

  const controls = document.createElement("div");
  controls.className = "controls";
  area.appendChild(controls);

  [
    ["↑", 0, -1],
    ["↓", 0, 1],
    ["←", -1, 0],
    ["→", 1, 0]
  ].forEach(([label, x, y]) => {
    makeButton(label, () => changeDirection(x, y), controls);
  });

  function newFood() {

    do {
      food = {
        x:
